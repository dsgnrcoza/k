<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>How it works — K</title>
  <link rel="icon" type="image/jpeg" href="Assets/K Logo Black Background.jpg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-left">
      <a class="logo" href="index.html" aria-label="K home">
        <img src="Assets/K Logo White (Transparent, Generated).png" alt="K logo" />
      </a>

      <nav class="main-nav" aria-label="Primary">
        <ul>
          <li><a href="index.html#how-it-works">How it works</a></li>
          <li><a href="index.html#pricing">Pricing</a></li>
          <li><a href="#case-studies">Case Studies</a></li>
        </ul>
      </nav>
    </div>

    <a class="btn btn-pill" href="#contact">Contact</a>
  </header>

  <main>
    <section class="contact-section" id="contact">
      <div class="contact-inner">
        <div class="contact-info">
          <h2>Let's start something</h2>
          <p>
            Tell us a bit about your project and we'll get back to you within
            a day. No forms full of jargon, no sales calls before you're ready.
          </p>
          <div class="contact-detail">hello@kstudio.com</div>
          <div class="contact-detail">
            <a href="#">@kstudio</a>
          </div>
        </div>

        <form class="contact-form" id="contact-form">
          <div class="form-field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required />
          </div>
          <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="form-field">
            <label for="message">Project details</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn btn-pill">Send message</button>
        </form>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var form = document.getElementById("contact-form");
      if (!form) return;
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var wrapper = form.parentNode;
        var success = document.createElement("div");
        success.className = "contact-success";
        success.innerHTML = "Thanks — we'll be in touch <span>soon</span>.";
        wrapper.replaceChild(success, form);
      });
    })();
  </script>
</body>
</html>
