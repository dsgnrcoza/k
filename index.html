<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K — Everything a studio does, without the studio prices</title>
  <link rel="icon" type="image/jpeg" href="Assets/K Logo Black Background.jpg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-left">
      <a class="logo" href="index.html" aria-label="K home">
        <img src="Assets/K Logo White (Transparent, Generated).png" alt="K logo" />
      </a>

      <nav class="main-nav" aria-label="Primary">
        <ul>
          <li><a href="how-it-works.html">How it works</a></li>
          <li><a href="#pricing">Pricing</a></li>
          <li><a href="#case-studies">Case Studies</a></li>
        </ul>
      </nav>
    </div>

    <a class="btn btn-pill" href="how-it-works.html#contact">Contact</a>
  </header>

  <main>
    <section class="hero">
      <video
        class="hero-video"
        autoplay
        muted
        playsinline
        poster="Assets/K Logo Black Background.jpg"
      >
        <source src="Assets/NEW VIDEO (sparkle removed).mp4" type="video/mp4" />
      </video>

      <div class="hero-overlay" aria-hidden="true"></div>

      <div class="hero-screen-mockup" aria-hidden="true">
        <div class="mockup-frame">
          <img class="mockup-img is-active" src="Assets/Work/placeholder-1.png" alt="" />
          <img class="mockup-img" src="Assets/Work/placeholder-2.png" alt="" />
          <img class="mockup-img" src="Assets/Work/placeholder-3.png" alt="" />
          <img class="mockup-img" src="Assets/Work/placeholder-4.png" alt="" />
          <img class="mockup-img" src="Assets/Work/placeholder-5.png" alt="" />
        </div>
      </div>

      <div class="hero-content">
        <h1>Everything a studio does,<br />without the studio prices or the waiting.</h1>
        <div class="hero-actions">
          <a class="btn btn-pill" href="#get-started">Get started</a>
          <a class="btn btn-text" href="#more">Tell me more</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var video = document.querySelector(".hero-video");
      var mockup = document.querySelector(".hero-screen-mockup");
      var imgs = mockup ? Array.from(mockup.querySelectorAll(".mockup-img")) : [];
      if (!video || !mockup || !imgs.length) return;

      var SCREEN_START = 5.0;
      var ITEM_MS = 650;
      var running = false;

      function runShuffle() {
        running = true;
        video.pause();
        video.classList.add("is-hidden");
        mockup.classList.add("is-visible");

        var idx = 0;
        imgs.forEach(function (im, i) {
          im.classList.toggle("is-active", i === 0);
        });

        var interval = setInterval(function () {
          idx++;
          if (idx >= imgs.length) {
            clearInterval(interval);
            setTimeout(finishShuffle, ITEM_MS);
            return;
          }
          imgs.forEach(function (im, i) {
            im.classList.toggle("is-active", i === idx);
          });
        }, ITEM_MS);
      }

      function finishShuffle() {
        mockup.classList.remove("is-visible");
        video.classList.remove("is-hidden");
        video.currentTime = 0;
        video.play();
        setTimeout(function () {
          running = false;
        }, 600);
      }

      video.addEventListener("timeupdate", function () {
        if (!running && video.currentTime >= SCREEN_START) {
          runShuffle();
        }
      });
    })();
  </script>
</body>
</html>
