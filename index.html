<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K — Everything a studio does, without the studio prices</title>
  <link rel="icon" type="image/jpeg" href="Assets/K Logo Black Background.jpg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-left">
      <a class="logo" href="/" aria-label="K home">
        <img src="Assets/K Logo White (Transparent, Generated).png" alt="K logo" />
      </a>

      <nav class="main-nav" aria-label="Primary">
        <ul>
          <li><a href="#how-it-works">How it works</a></li>
          <li><a href="#prices">Prices</a></li>
          <li><a href="#case-studies">Case Studies</a></li>
        </ul>
      </nav>
    </div>

    <a class="btn btn-pill" href="#contact">Contact</a>
  </header>

  <main>
    <section class="hero">
      <video
        class="hero-video"
        autoplay
        loop
        muted
        playsinline
        poster="Assets/K Logo Black Background.jpg"
      >
        <source src="Assets/NEW VIDEO (sparkle removed).mp4" type="video/mp4" />
      </video>

      <div class="hero-overlay" aria-hidden="true"></div>

      <div class="hero-content">
        <h1>Everything a studio does,<br />without the studio prices or the waiting.</h1>
        <div class="hero-actions">
          <a class="btn btn-pill" href="#get-started">Get started</a>
          <a class="btn btn-text" href="#more">Tell me more</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
